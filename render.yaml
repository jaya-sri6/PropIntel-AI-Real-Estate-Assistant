services:
  - type: web
    name: propintel-ai
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        value: propintel-admin-secret-2026
      - key: ENVIRONMENT
        value: production
      - key: EMBEDDING_DEVICE
        value: cpu
