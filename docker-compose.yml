version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: propintel_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-propintel}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - propintel_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: propintel_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-propintel}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/free}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-propintel-admin-secret-2026}
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
      - SIMILARITY_THRESHOLD=0.25
      - TOP_K_CHUNKS=6
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - propintel_network

volumes:
  postgres_data:
    driver: local

networks:
  propintel_network:
    driver: bridge
